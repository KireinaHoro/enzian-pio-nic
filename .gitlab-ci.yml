include:
  - local: vivado/eci/container.yml

stages:
  - test
  - prepare
  - build-hw
  - report
  - release

variables:
  GIT_STRATEGY: clone
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    # Docker supplies isolation; this executor disallows nested namespaces.
    sandbox = false
    cores = 8
    max-jobs = 1

.nix:
  tags: [enzian-docker]
  # Environment warmed from platform 2aaa537; jobs build/test their locked checkout.
  image:
    name: registry.ethz.ch/project-openenzian/ci-images/lauberhorn-flakes:980991e21d0b2a99efaf799e4b65c218b7ebbd85@sha256:15a065efb42dd3b40ecae14d6abaca6a64afa1b9541cff5e57d79c3d075efbea
    entrypoint: [""]
  before_script:
    # FORCE_HTTPS config is runner-local; Nix fetches through a separate Git cache.
    - git config --global --add url."https://gitlab.inf.ethz.ch/".insteadOf 'git@gitlab.inf.ethz.ch:'
    - git config --global --add url."https://gitlab.inf.ethz.ch/".insteadOf 'ssh://git@gitlab.inf.ethz.ch/'
    # The runner helper owns checkout; Nix runs Git as the container user.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git submodule foreach --recursive 'git config --global --add safe.directory "$PWD"'
    # Nix fetches submodules in its own cache, outside runner-local Git config.
    # Store only an environment reference; never put the job token in a URL.
    - |
      git config --global credential."https://gitlab.inf.ethz.ch".helper '!f() { if test "$1" = get; then printf "%s\n" "username=gitlab-ci-token" "password=$CI_JOB_TOKEN"; fi; }; f'

.test-nix:
  extends: .nix
  stage: test
  script:
    - nix run --no-update-lock-file .#ciBuild -- "$CI_JOB_NAME" ".#checks.x86_64-linux.$CI_JOB_NAME"
  artifacts:
    when: always
    paths: [out/ci/]
    reports:
      junit: out/ci/**/test-report.xml

fast-tests-eci:
  extends: .test-nix

blocks-tests:
  extends: .test-nix

trace-tests:
  extends: .test-nix

trace-fifo-tests:
  extends: .test-nix

workflow-tools:
  extends: .test-nix

interactive:
  extends: .test-nix

runtime-interface:
  extends: .test-nix

prepare-eci:
  extends: .nix
  stage: prepare
  needs:
    - job: fast-tests-eci
      artifacts: false
    - job: blocks-tests
      artifacts: false
    - job: trace-tests
      artifacts: false
    - job: trace-fifo-tests
      artifacts: false
    - job: workflow-tools
      artifacts: false
    - job: interactive
      artifacts: false
    - job: runtime-interface
      artifacts: false
  script:
    - nix run --no-update-lock-file .#prepareEci
  artifacts:
    when: always
    paths:
      - out/eci/vivado-inputs/
      - out/eci/generateVerilog.dest/
      - out/deploy.img
      - out/ci/**/build.log

build-hw-eci:
  tags: [enzian-docker, vivado]
  extends: .vivado-environment
  stage: build-hw
  # The preceding Nix job supplies every source. Do not re-fetch or regenerate.
  variables:
    GIT_STRATEGY: empty
    GIT_SUBMODULE_STRATEGY: none
    RUNNER_AFTER_SCRIPT_TIMEOUT: "20m"
  needs:
    - job: prepare-eci
      artifacts: true
  script:
    - bash out/eci/vivado-inputs/tools/hardware/run-vivado.sh out/eci/vivado-inputs out build
  after_script:
    - bash out/eci/vivado-inputs/tools/hardware/run-vivado.sh out/eci/vivado-inputs out report
  artifacts:
    when: always
    paths:
      - out/eci/generateVerilog.dest/
      - out/eci/vivado-inputs/git-revision
      - out/eci/vivado-inputs/rtl-derivation
      - out/eci/vivado-inputs/flake.lock
      - out/physical/
      - out/physical-vivado.log
      - out/vivado-build.log
      - out/eci/vivadoProject.dest/*timing*.rpt
      - out/eci/vivadoProject.dest/*utilization*.rpt
      - out/eci/vivadoProject.dest/shell_lauberhorn-eci_routed.dcp
      - out/eci/vivadoProject.dest/shell_lauberhorn-eci.bit
      - out/eci/vivadoProject.dest/shell_lauberhorn-eci.ltx

report-hw-eci:
  extends: .nix
  stage: report
  needs:
    - job: build-hw-eci
      artifacts: true
  when: always
  script:
    - nix run --no-update-lock-file .#summarizePhysical -- out/physical
    - test -f out/physical/COMPLETE
  artifacts:
    when: always
    paths: [out/physical/]

# Publication performs no compilation; keep the existing release service.
publish:
  stage: release
  image: registry.ethz.ch/project-openenzian/ci-images/publish:ubuntu-22.04
  script: /publish_artifacts
  rules:
    - if: '$CI_COMMIT_TAG'
  needs:
    - job: build-hw-eci
      artifacts: true
    - job: prepare-eci
      artifacts: true
    - job: report-hw-eci
      artifacts: false
  variables:
    PROJECT_ID: 47960
    PACKAGE_NAME: release
    RELEASE_NAME: 'Release $CI_COMMIT_TAG'
    RELEASE_TAG: '$CI_COMMIT_TAG'
    ARTIFACT_PATHS: |
      out/deploy.img
      out/eci/vivadoProject.dest/shell_lauberhorn-eci_routed.dcp
      out/eci/vivadoProject.dest/shell_lauberhorn-eci.bit
      out/eci/vivadoProject.dest/shell_lauberhorn-eci.ltx
