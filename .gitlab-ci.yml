include:
  - local: vivado/eci/container.yml

stages:
  - test
  - prepare
  - build-hw
  - report
  - release

variables:
  GIT_STRATEGY: clone
  # Build/test jobs do not need the large measurement traces.
  GIT_LFS_SKIP_SMUDGE: "1"
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    # Docker supplies isolation; this executor disallows nested namespaces.
    sandbox = false
    cores = 8
    max-jobs = 1

.nix:
  tags: [enzian-docker]
  # Environment warmed from platform 2aaa537; jobs build/test their locked checkout.
  image:
    name: registry.ethz.ch/project-openenzian/ci-images/lauberhorn-flakes:980991e21d0b2a99efaf799e4b65c218b7ebbd85@sha256:15a065efb42dd3b40ecae14d6abaca6a64afa1b9541cff5e57d79c3d075efbea
    entrypoint: [""]
  before_script:
    - bash tools/ci/setup-job.sh

.test-nix:
  extends: .nix
  stage: test
  script:
    - nix run --no-update-lock-file .#ciBuild -- "$CI_JOB_NAME" ".#checks.x86_64-linux.$CI_JOB_NAME"
  artifacts:
    when: always
    paths: [out/ci/]
    reports:
      junit: out/ci/**/test-report.xml

fast-tests-eci:
  extends: .test-nix

dcs-rom-thx:
  extends: .test-nix

dcs-lauberhorn:
  extends: .test-nix

blocks-tests:
  extends: .test-nix

trace-tests:
  extends: .test-nix

trace-fifo-tests:
  extends: .test-nix

eci-toolkit-rx:
  extends: .test-nix

workflow-tools:
  extends: .test-nix

output-interface:
  extends: .test-nix

interactive:
  extends: .test-nix

runtime-interface:
  extends: .test-nix

memcached-adapter:
  extends: .test-nix
  rules:
    - if: '$LAUBERHORN_SKIP_MEMCACHED == "1"'
      when: never
    - when: on_success

runtime-tests:
  extends: .test-nix

eci-address-map:
  extends: .test-nix

scheduling-cooperative:
  extends: .test-nix

prepare-eci:
  extends: .nix
  stage: prepare
  needs:
    - job: fast-tests-eci
      artifacts: false
    - job: dcs-rom-thx
      artifacts: false
    - job: dcs-lauberhorn
      artifacts: false
    - job: blocks-tests
      artifacts: false
    - job: trace-tests
      artifacts: false
    - job: trace-fifo-tests
      artifacts: false
    - job: eci-toolkit-rx
      artifacts: false
    - job: workflow-tools
      artifacts: false
    - job: output-interface
      artifacts: false
    - job: interactive
      artifacts: false
    - job: runtime-interface
      artifacts: false
    - job: memcached-adapter
      artifacts: false
      optional: true
    - job: runtime-tests
      artifacts: false
    - job: eci-address-map
      artifacts: false
    - job: scheduling-cooperative
      artifacts: false
  script:
    - nix run --no-update-lock-file .#prepareEci
  artifacts:
    when: always
    paths:
      - out/eci/vivado-inputs/
      - out/eci/generateVerilog.dest/
      - out/deploy.img
      - out/memcached-deploy.img
      - out/ci-scope.json
      - out/ci/**/build.log

build-hw-eci:
  tags: [enzian-docker, vivado]
  extends: .vivado-environment
  stage: build-hw
  # The preceding Nix job supplies every source. Do not re-fetch or regenerate.
  variables:
    GIT_STRATEGY: empty
    GIT_SUBMODULE_STRATEGY: none
    RUNNER_AFTER_SCRIPT_TIMEOUT: "20m"
  needs:
    - job: prepare-eci
      artifacts: true
  script:
    - bash out/eci/vivado-inputs/tools/hardware/run-vivado.sh out/eci/vivado-inputs out build
  after_script:
    - bash out/eci/vivado-inputs/tools/hardware/run-vivado.sh out/eci/vivado-inputs out report
  artifacts:
    when: always
    paths:
      - out/eci/generateVerilog.dest/
      - out/eci/vivado-inputs/git-revision
      - out/eci/vivado-inputs/rtl-derivation
      - out/eci/vivado-inputs/dcs-rom-derivation
      - out/eci/vivado-inputs/generated/dcs-rom/
      - out/eci/vivado-inputs/flake.lock
      - out/physical/
      - out/physical-vivado.log
      - out/vivado-build.log
      - out/eci/vivadoProject.dest/*timing*.rpt
      - out/eci/vivadoProject.dest/*utilization*.rpt
      - out/eci/vivadoProject.dest/shell_lauberhorn-eci_routed.dcp
      - out/eci/vivadoProject.dest/shell_lauberhorn-eci.bit
      - out/eci/vivadoProject.dest/shell_lauberhorn-eci.ltx
      - out/eci/vivadoProject.dest/lauberhorn_trace_dma_map.json*

report-hw-eci:
  extends: .nix
  stage: report
  needs:
    - job: build-hw-eci
      artifacts: true
  # Stay skipped after a failed build; a successful retry can then unblock us.
  # needs downloads artifacts from the hardware job in this pipeline.
  when: on_success
  script:
    - nix run --no-update-lock-file .#summarizePhysical -- out/physical
    - test -f out/physical/COMPLETE
  artifacts:
    when: always
    paths: [out/physical/]

# Publication performs no compilation; keep the existing release service.
publish:
  stage: release
  image: registry.ethz.ch/project-openenzian/ci-images/publish:ubuntu-22.04
  script: /publish_artifacts
  rules:
    - if: '$CI_COMMIT_TAG'
  needs:
    - job: build-hw-eci
      artifacts: true
    - job: prepare-eci
      artifacts: true
    - job: report-hw-eci
      artifacts: false
  variables:
    PROJECT_ID: 47960
    PACKAGE_NAME: release
    RELEASE_NAME: 'Release $CI_COMMIT_TAG'
    RELEASE_TAG: '$CI_COMMIT_TAG'
    ARTIFACT_PATHS: |
      out/deploy.img
      out/eci/vivadoProject.dest/shell_lauberhorn-eci_routed.dcp
      out/eci/vivadoProject.dest/shell_lauberhorn-eci.bit
      out/eci/vivadoProject.dest/shell_lauberhorn-eci.ltx
      out/eci/vivadoProject.dest/lauberhorn_trace_dma_map.json
      out/eci/vivadoProject.dest/lauberhorn_trace_dma_map.json.depths.tsv
